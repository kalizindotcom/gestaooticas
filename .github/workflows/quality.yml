name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, test, build and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Backend typecheck
        run: npm run typecheck:ci

      - name: Full application typecheck
        run: npm run typecheck

      - name: Backend and test lint
        run: npm run lint:ci

      - name: Test suite
        run: npm test -- --reporter=dot

      - name: Production build
        run: npm run build

      - name: API smoke test
        run: npm run smoke:api

      - name: Continuity smoke test
        run: npm run smoke:continuity
